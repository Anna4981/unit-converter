<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="converter">
    <h1>Unit Converter</h1>
    <p class="subtitle">Type a value and see the result instantly.</p>

    <div class="field">
      <label for="category">Unit type</label>
      <select id="category"></select>
    </div>

    <div class="field">
      <label for="inputValue">Value</label>
      <input type="number" id="inputValue" placeholder="Enter a number" value="1" step="any">
    </div>

    <div class="row">
      <div class="field">
        <label for="fromUnit">From</label>
        <select id="fromUnit"></select>
      </div>
      <div class="field">
        <label for="toUnit">To</label>
        <select id="toUnit"></select>
      </div>
    </div>

    <div class="swap-wrap">
      <button type="button" id="swapBtn">⇅ Swap units</button>
    </div>

    <div class="field">
      <label for="result">Result</label>
      <input type="text" id="result" readonly>
    </div>

    <p class="message" id="message" aria-live="polite"></p>
    <div class="summary" id="summary"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
